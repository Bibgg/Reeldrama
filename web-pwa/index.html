<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#09090D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ReelDrama - Short Video Streaming</title>
  
  <link rel="manifest" href="manifest.json">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0" />
  <link rel="stylesheet" href="styles.css">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brandDark: '#09090D',
            brandSurface: '#13131A',
            brandCard: '#1A1A24',
            brandRed: '#FF2A54',
            brandCrimson: '#E50914',
            brandGold: '#FFB800'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-brandDark text-white h-screen w-screen overflow-hidden select-none font-sans">

  <!-- TOP BAR OVERLAY -->
  <header class="fixed top-0 left-0 right-0 z-30 flex items-center justify-between px-4 pt-4 pb-2 bg-gradient-to-b from-black/80 via-black/40 to-transparent pointer-events-none">
    <!-- Drama Series Picker -->
    <div id="series-pill" class="flex items-center gap-2 bg-black/60 backdrop-blur-md border border-white/10 rounded-full px-3 py-1.5 cursor-pointer pointer-events-auto active:scale-95 transition-transform">
      <div class="w-6 h-6 rounded-full bg-brandRed flex items-center justify-center">
        <span class="material-symbols-rounded text-sm text-white">play_arrow</span>
      </div>
      <div class="flex flex-col text-left">
        <span class="text-[9px] font-black tracking-wider text-brandRed leading-none">REELDRAMA</span>
        <span id="header-series-title" class="text-xs font-bold text-white max-w-[140px] truncate leading-tight">Billionaire's Secret Bride</span>
      </div>
      <span class="material-symbols-rounded text-sm text-white/60">expand_more</span>
    </div>

    <!-- Quick Utilities -->
    <div class="flex items-center gap-2 pointer-events-auto">
      <button id="btn-mute" class="w-8 h-8 rounded-full bg-black/50 backdrop-blur-md border border-white/15 flex items-center justify-center active:scale-90 transition">
        <span id="mute-icon" class="material-symbols-rounded text-base text-white">volume_up</span>
      </button>
      <button id="btn-speed" class="px-2.5 h-8 rounded-full bg-black/50 backdrop-blur-md border border-white/15 text-[11px] font-bold text-white flex items-center justify-center active:scale-90 transition">
        <span id="speed-text">1.0x</span>
      </button>
    </div>
  </header>

  <!-- VERTICAL REEL STREAMING CONTAINER -->
  <main id="reel-container" class="w-full h-full overflow-y-scroll snap-y snap-mandatory scroll-smooth no-scrollbar relative">
    <!-- Reel items will be dynamically generated by app.js -->
  </main>

  <!-- EPISODES BOTTOM SHEET MODAL -->
  <div id="episodes-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden flex flex-col justify-end transition-opacity">
    <div class="bg-brandSurface border-t border-white/10 rounded-t-3xl max-h-[75vh] flex flex-col p-4 animate-slide-up">
      <div class="w-10 h-1 bg-white/20 rounded-full mx-auto mb-3"></div>
      
      <!-- Sheet Header -->
      <div class="flex items-center justify-between pb-3 border-b border-white/10">
        <div>
          <h3 id="episodes-modal-series-title" class="text-base font-bold text-white">Billionaire's Secret Bride</h3>
          <p id="episodes-modal-count" class="text-xs text-white/60">45 Episodes • 28.4M Views</p>
        </div>
        <button id="close-episodes-btn" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-white/70 active:scale-90">
          <span class="material-symbols-rounded">close</span>
        </button>
      </div>

      <!-- Episodes Grid / List -->
      <div id="episodes-list" class="overflow-y-auto py-3 space-y-2.5 flex-1 pr-1">
        <!-- Rendered by JS -->
      </div>
    </div>
  </div>

  <!-- SERIES BROWSER MODAL -->
  <div id="series-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden flex flex-col justify-end transition-opacity">
    <div class="bg-brandSurface border-t border-white/10 rounded-t-3xl max-h-[80vh] flex flex-col p-4 animate-slide-up">
      <div class="w-10 h-1 bg-white/20 rounded-full mx-auto mb-3"></div>
      
      <div class="flex items-center justify-between pb-3 border-b border-white/10">
        <div>
          <h3 class="text-base font-bold text-white">Drama Series Hub</h3>
          <p class="text-xs text-white/60">Choose a binge-worthy vertical drama</p>
        </div>
        <button id="close-series-btn" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-white/70 active:scale-90">
          <span class="material-symbols-rounded">close</span>
        </button>
      </div>

      <div id="series-list" class="overflow-y-auto py-3 space-y-3 flex-1 pr-1">
        <!-- Rendered by JS -->
      </div>
    </div>
  </div>

  <!-- COMMENTS MODAL -->
  <div id="comments-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden flex flex-col justify-end transition-opacity">
    <div class="bg-brandSurface border-t border-white/10 rounded-t-3xl max-h-[70vh] flex flex-col p-4 animate-slide-up">
      <div class="w-10 h-1 bg-white/20 rounded-full mx-auto mb-3"></div>
      
      <div class="flex items-center justify-between pb-3 border-b border-white/10">
        <h3 class="text-base font-bold text-white">Viewer Comments</h3>
        <button id="close-comments-btn" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-white/70 active:scale-90">
          <span class="material-symbols-rounded">close</span>
        </button>
      </div>

      <div id="comments-list" class="overflow-y-auto py-3 space-y-3 flex-1 pr-1">
        <!-- Rendered by JS -->
      </div>
    </div>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 bg-brandCard/90 border border-white/15 px-4 py-2 rounded-full text-xs font-semibold shadow-2xl backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-300">
    <span id="toast-text">Notification</span>
  </div>

  <script src="app.js"></script>
</body>
</html>
