name: Build Android App (AAB & APK)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant Execute Permission for GradleW
      run: chmod +x gradlew

    - name: APK File Build (Testing के लिए)
      run: ./gradlew assembleDebug

    - name: Play Store के लिए AAB File बनाना
      run: ./gradlew bundleRelease

    - name: Build Release Bundle (AAB)
      run: ./gradlew bundleRelease || ./gradlew bundleDebug

    - name: AAB और APK फ़ाइलें को GitHub पर डाउनलोड के लिए उपलब्ध कराना
      uses: actions/upload-artifact@v4
      with:
        name: ReelDrama-APK
        path: app/build/outputs/apk/debug/*.apk

    - name: Upload AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ReelDrama-AAB
        path: app/build/outputs/bundle/release/*.aab
        
