name: Build Android App (AAB & APK)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # debug.keystore बनाना (build.gradle.kts इसी फ़ाइल को ढूँढता है)
      - name: Create debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # APK File बनाना (Testing के लिए)
      - name: Build Debug APK
        run: gradle assembleDebug

      # Play Store के लिए AAB File बनाना
      - name: Build Release Bundle (AAB)
        run: gradle bundleRelease || gradle bundleDebug

      # AAB और APK फाइल्स को GitHub पर डाउनलोड के लिए उपलब्ध कराना
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReelDrama-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReelDrama-AAB
          path: app/build/outputs/bundle/**/*.aab
